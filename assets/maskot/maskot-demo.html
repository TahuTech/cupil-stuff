<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo maskot Cupil Stuff</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6f5f2; color: #6b6b70; }
  .wadah { text-align: center; }
  .maskot { width: 220px; cursor: pointer; touch-action: manipulation; transition: transform .2s cubic-bezier(.3, 1.7, .6, 1); }
  .maskot.hop { transform: translateY(-16px) rotate(-3deg); }
  .maskot .lid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); transition: transform .08s; }
  .maskot.blink .lid { transform: scaleY(1); }
  .maskot .happy, .maskot .spark, .maskot .mulut-senang { opacity: 0; transition: opacity .1s; }
  .maskot.senang .happy, .maskot.senang .spark, .maskot.senang .mulut-senang { opacity: 1; }
  .maskot.senang .mata, .maskot.senang .mulut-biasa { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .maskot, .maskot .lid { transition: none; }
    .maskot.hop { transform: none; }
  }
</style>
</head>
<body>
<div class="wadah">
  <div id="tempat-maskot"></div>
  <p>Gerakkan kursor, lalu ketuk penguinnya</p>
</div>
<script>
  // Di Astro, SVG ditaruh inline di komponen. Di demo ini dimuat dari file sebelahnya.
  fetch("maskot-penguin.svg").then((r) => r.text()).then((svg) => {
    document.getElementById("tempat-maskot").innerHTML = svg;
    pasangMaskot(document.querySelector(".maskot"));
  });

  function pasangMaskot(peng) {
    const gerakBoleh = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    const bola = [...peng.querySelectorAll(".bola")];
    const kilau = [...peng.querySelectorAll(".kilau")];
    const posisi = (el) => ({ el, x: +el.getAttribute("cx"), y: +el.getAttribute("cy") });
    const titik = [...bola, ...kilau].map(posisi);

    // pupil mengikuti kursor (desktop) atau sentuhan terakhir (HP), maksimal 4 unit
    function lihat(cx, cy) {
      if (!gerakBoleh) return;
      const r = peng.getBoundingClientRect();
      const s = r.width / 220;
      const dx = cx - (r.left + 110 * s);
      const dy = cy - (r.top + 112 * s);
      const d = Math.hypot(dx, dy) || 1;
      const m = Math.min(4, d / 35);
      titik.forEach((t) => {
        t.el.setAttribute("cx", t.x + (dx / d) * m);
        t.el.setAttribute("cy", t.y + (dy / d) * m);
      });
    }
    document.addEventListener("pointermove", (e) => lihat(e.clientX, e.clientY), { passive: true });
    document.addEventListener("pointerdown", (e) => lihat(e.clientX, e.clientY), { passive: true });

    // kedip otomatis acak
    function kedip() {
      if (peng.classList.contains("senang")) return;
      peng.classList.add("blink");
      setTimeout(() => peng.classList.remove("blink"), 150);
    }
    (function jadwal() {
      setTimeout(() => { kedip(); jadwal(); }, 2500 + Math.random() * 3000);
    })();

    // diketuk: ekspresi senang + lompat kecil
    let timer;
    peng.addEventListener("click", () => {
      clearTimeout(timer);
      peng.classList.add("senang");
      if (gerakBoleh) {
        peng.classList.add("hop");
        setTimeout(() => peng.classList.remove("hop"), 200);
      }
      timer = setTimeout(() => peng.classList.remove("senang"), 1200);
    });
  }
</script>
</body>
</html>
