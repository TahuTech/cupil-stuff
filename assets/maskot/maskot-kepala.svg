<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 16 160 160" class="maskot maskot-kepala" aria-hidden="true">
  <!-- Kepala maskot penguin Cupil Stuff, untuk header dan favicon.
       Kelas animasi sama dengan maskot-penguin.svg:
       .bola / .kilau (pupil), .lid (kedip), .happy dan .mulut-senang (tampil saat .senang),
       .mata dan .mulut-biasa (disembunyikan saat .senang).
       Titik tengah mata untuk pelacakan kursor: (110, 112) dalam koordinat viewBox. -->
  <ellipse cx="110" cy="108" rx="68" ry="60" fill="#1E1F26"/>
  <path d="M110 82 Q122 70 140 74 Q170 82 168 116 Q166 150 110 154 Q54 150 52 116 Q50 82 80 74 Q98 70 110 82 Z" fill="#FFFFFF"/>
  <g class="mata">
    <g>
      <circle class="bola" cx="86" cy="112" r="11" fill="#1E1F26"/>
      <circle class="kilau" cx="89" cy="108" r="3.6" fill="#fff"/>
    </g>
    <g>
      <circle class="bola" cx="134" cy="112" r="11" fill="#1E1F26"/>
      <circle class="kilau" cx="137" cy="108" r="3.6" fill="#fff"/>
    </g>
    <rect class="lid" x="73" y="99" width="26" height="26" rx="13" fill="#FFFFFF"/>
    <rect class="lid" x="121" y="99" width="26" height="26" rx="13" fill="#FFFFFF"/>
    <path class="lid" d="M74 112 Q86 120 98 112" stroke="#1E1F26" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path class="lid" d="M122 112 Q134 120 146 112" stroke="#1E1F26" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- garis lebih tebal dari versi badan penuh supaya tetap terbaca di ukuran kecil -->
  <g class="happy" stroke="#1E1F26" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 116 Q86 102 96 116"/>
    <path d="M124 116 Q134 102 144 116"/>
  </g>
  <ellipse cx="68" cy="132" rx="10" ry="6" fill="#F7A1B0"/>
  <ellipse cx="152" cy="132" rx="10" ry="6" fill="#F7A1B0"/>
  <path class="mulut-biasa" d="M102 128 L118 128 L110 138 Z" fill="#F5A623"/>
  <g class="mulut-senang">
    <path d="M101 128 L119 128 L110 134 Z" fill="#F5A623"/>
    <path d="M103 134 Q110 150 117 134 Z" fill="#E2546B"/>
  </g>
  <path d="M44 82 Q46 34 110 30 Q174 34 176 82 Z" fill="#3B6FD9"/>
  <path d="M40 80 Q110 70 180 80 Q186 90 176 94 Q110 84 44 94 Q34 90 40 80 Z" fill="#2F5BB5"/>
  <circle cx="110" cy="29" r="7" fill="#7FA6F0"/>
  <circle cx="88" cy="58" r="13" fill="#FFFFFF"/>
  <path d="M94 52 Q88 48 83 53 Q80 58 83 63 Q88 68 94 64" stroke="#3B6FD9" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</svg>
