# Cupil Stuff — layanan di homelab
# Development (hanya PocketBase):  docker compose up -d --build
# Produksi (dengan Tunnel):        docker compose --profile tunnel up -d --build
services:
  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: "0.40.3" # kunci versi; naikkan secara sengaja setelah baca catatan rilis
    restart: unless-stopped
    environment:
      # URL deploy hook Cloudflare Pages (Settings → Builds → Deploy hooks).
      # Kosongkan jika belum ada; build ulang otomatis akan dilewati.
      PAGES_DEPLOY_HOOK: ${PAGES_DEPLOY_HOOK:-}
      # Alamat katalog (https://<domain>), untuk tautan /bayar dan /cek-tiket di pesan WhatsApp
      SITE_URL: ${SITE_URL:-}
      # Alamat PocketBase publik (https://api.<domain>), untuk link ke panel admin di notifikasi
      API_URL: ${API_URL:-}
      # Notifikasi Telegram ke pemilik toko (lihat README). Kosong = notifikasi dilewati.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Hanya untuk pengujian lokal; biarkan kosong.
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-}
    # CORS: origin yang boleh memanggil API dari browser (route /api/checkout).
    # Produksi: isi PB_ORIGINS di .env dengan alamat katalog, misalnya https://cupilstuff.web.id
    # Default untuk development: astro dev / preview di localhost.
    command:
      - /pb/pocketbase
      - serve
      - --http=0.0.0.0:8090
      - --dir=/pb/pb_data
      - --migrationsDir=/pb/pb_migrations
      - --hooksDir=/pb/pb_hooks
      - --origins=${PB_ORIGINS:-http://localhost:4321,http://127.0.0.1:4321}
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
      - ./pocketbase/pb_hooks:/pb/pb_hooks
    ports:
      # Hanya bisa dibuka dari mesin homelab sendiri; akses dari internet lewat Cloudflare Tunnel.
      - "127.0.0.1:8090:8090"

  cloudflared:
    image: cloudflare/cloudflared:latest
    # hanya jalan dengan --profile tunnel (butuh CLOUDFLARE_TUNNEL_TOKEN di .env)
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - pocketbase
