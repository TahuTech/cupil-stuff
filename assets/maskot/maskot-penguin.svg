  <path d="M50 86 Q110 78 170 86" stroke="#7FA6F0" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="110" cy="29" r="7" fill="#7FA6F0"/>
  <circle cx="88" cy="58" r="13" fill="#FFFFFF"/>
  <path d="M94 52 Q88 48 83 53 Q80 58 83 63 Q88 68 94 64" stroke="#3B6FD9" stroke-width="3.2" fill="none" stroke-linecap="round"/>
