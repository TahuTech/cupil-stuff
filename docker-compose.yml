# Cupil Stuff — layanan di homelab
# Jalankan: docker compose up -d --build
services:
  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: "0.40.3" # kunci versi; naikkan secara sengaja setelah baca catatan rilis
    restart: unless-stopped
    environment:
      # URL deploy hook Cloudflare Pages (Settings → Builds → Deploy hooks).
      # Kosongkan jika belum ada; build ulang otomatis akan dilewati.
      PAGES_DEPLOY_HOOK: ${PAGES_DEPLOY_HOOK:-}
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
      - ./pocketbase/pb_hooks:/pb/pb_hooks
    ports:
      # Hanya bisa dibuka dari mesin homelab sendiri; akses dari internet lewat Cloudflare Tunnel.
      - "127.0.0.1:8090:8090"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - pocketbase
